name: ftl-opportunity-intelligence

x-app-common: &app-common
  image: ftl-opportunity-intelligence:${APP_IMAGE_TAG:-local}
  build:
    context: .
    target: runtime
  env_file:
    - ${ENV_FILE:-.env}
  init: true
  restart: unless-stopped
  networks:
    - backend
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-app-security: &app-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    env_file:
      - ${ENV_FILE:-.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:8.8.1-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped

  migrate:
    <<: [*app-common, *app-security]
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    profiles: ["release"]

  web:
    <<: [*app-common, *app-security]
    command: ["./scripts/start-web.sh"]
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker-core:
    <<: [*app-common, *app-security]
    command:
      - ./scripts/start-worker.sh
      - discovery,fetch,parse,classification,aggregation,research,solution_design,asset_matching,drafting,review,maintenance
    volumes:
      - media_data:/app/media
    profiles: ["workers"]

  worker-research:
    <<: [*app-common, *app-security]
    command:
      - ./scripts/start-worker.sh
      - research,deep_research,contact_enrichment
    environment:
      CELERY_WORKER_CONCURRENCY: ${CELERY_RESEARCH_WORKER_CONCURRENCY:-1}
    volumes:
      - media_data:/app/media
    profiles: ["workers"]

  beat:
    <<: [*app-common, *app-security]
    command: ["./scripts/start-beat.sh"]
    profiles: ["workers"]

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:80"
    volumes:
      - ./docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    networks:
      - backend
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  quality:
    build:
      context: .
      target: quality
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_ENV: test
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: deterministic-quality-key-not-for-production-use-only # pragma: allowlist secret
      USE_SQLITE: "1"
    init: true
    networks:
      - backend
    profiles: ["quality"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  backend:

volumes:
  postgres_data:
  redis_data:
  media_data:
